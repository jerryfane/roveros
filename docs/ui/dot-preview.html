*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0a0a0b;color:#e8e8ea;font:14px/1.4 system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.shell{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100%}
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid #1e1e22}
.top h1{font:600 15px system-ui,sans-serif;letter-spacing:.02em;white-space:nowrap}
.top h1 small{color:#77777f;font-weight:400;margin-left:8px}
.tour{margin-left:auto;padding:7px 12px;border:1px solid #26262b;border-radius:8px;color:#9a9aa3;font-size:13px}
.tour.on{color:#e8e8ea;border-color:#e8e8ea}
.side{border-right:1px solid #1e1e22;overflow:auto;padding:12px 8px}
.side button{display:flex;width:100%;gap:10px;padding:8px 10px;border-radius:8px;color:#9a9aa3;text-align:left;font-size:13.5px}
.side button i{font-style:normal;color:#55555c;width:18px;font-variant-numeric:tabular-nums}
.side button.on{background:#17171a;color:#fff}
.stage{position:relative;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:18px 12px 28px}
.fit{flex:none}
.fit .phone{transform-origin:top left}
.cap{max-width:760px;margin-top:14px;color:#9a9aa3;text-align:center;font-size:13.5px;line-height:1.5}
.cap b{color:#e8e8ea;font-weight:600}
.pager{display:flex;gap:10px;margin-top:12px;align-items:center;color:#77777f;font-size:12.5px}
.pager button{width:34px;height:34px;border:1px solid #26262b;border-radius:50%;color:#e8e8ea}
.phone{width:380px;height:820px;border-radius:46px;background:#020203;padding:10px;border:1px solid #2a2a30;box-shadow:0 0 0 2px #0c0c0e,0 30px 80px #000c;position:relative;flex:none}
.phone::after{content:"";position:absolute;top:21px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#050506;box-shadow:inset 0 0 0 1px #1c1c20;z-index:99;pointer-events:none}
.scr{width:360px;height:800px;border-radius:36px;overflow:hidden;position:relative;isolation:isolate;user-select:none;background:#000;color:#fff}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  .top{grid-column:1;padding:10px 12px}
  .top h1 small{display:none}
  .side{border-right:0;border-bottom:1px solid #1e1e22;display:flex;gap:4px;padding:8px 10px;overflow-x:auto}
  .side button{width:auto;white-space:nowrap;padding:6px 10px;gap:6px}
  .stage{padding:12px 6px 20px}
}
</style></head>
