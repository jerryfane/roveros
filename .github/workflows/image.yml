name: image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build the VM image
        run: tools/build.sh out
      - name: Boot it and check the self-check line
        run: tools/boot-test.sh out
      - name: Keep the screenshot and serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test
          path: |
            out/screen.png
            out/serial.log
            out/SHA256SUMS
          if-no-files-found: ignore

  phone:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [sweet, surya, davinci, tucana]
    env:
      ROVER_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the ${{ matrix.target }} image
        run: tools/build.sh out-${{ matrix.target }}
      - name: Check its structure
        run: tools/check-phone-image.sh out-${{ matrix.target }} ${{ matrix.target }}
      - name: Compress for download
        run: zstd -q -T0 --rm out-${{ matrix.target }}/rover.img
      - name: Keep the image
        uses: actions/upload-artifact@v4
        with:
          name: rover-${{ matrix.target }}
          path: |
            out-${{ matrix.target }}/rover.img.zst
            out-${{ matrix.target }}/u-boot-*.img
            out-${{ matrix.target }}/SHA256SUMS
          retention-days: 14
