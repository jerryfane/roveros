#!/usr/sbin/nft -f
# RoverOS firewall: nothing listens on mobile data, Wi-Fi, Ethernet or the
# hotspot. Everything on the tailnet interface is allowed.
flush ruleset

table inet rover {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iifname "lo" accept
    iifname "tailscale0" accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport 68 accept comment "DHCP replies"
    udp dport 41641 accept comment "Tailscale direct connections"
    # dev: ssh
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
